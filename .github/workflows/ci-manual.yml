name: Manual CI

on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: calendar
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: calendar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calendar -d calendar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Backend quality gates
        env:
          DJANGO_DEBUG: "true"
          DB_NAME: calendar
          DB_USER: calendar
          DB_PASSWORD: calendar
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: |
          ruff check .
          mypy .
          python manage.py check
          pytest tests/unit tests/contract tests/integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend quality gates
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm run test:component
