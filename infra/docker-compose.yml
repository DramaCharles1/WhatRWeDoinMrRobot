services:
  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
    depends_on:
      - backend

  backend:
    image: python:3.12
    working_dir: /app
    command: sh -c "pip install -e .[dev] && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_NAME: calendar
      DB_USER: calendar
      DB_PASSWORD: calendar
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "5432:5432"
