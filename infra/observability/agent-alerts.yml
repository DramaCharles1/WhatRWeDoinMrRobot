alerts:
  - name: AgentFailureRateHigh
    expr: agent_failure_rate > 0.05
    for: 5m
    severity: warning
  - name: AgentLatencyHigh
    expr: p95_agent_latency_ms > 1500
    for: 10m
    severity: warning
  - name: AgentDependencyDown
    expr: dependency_health == 0
    for: 2m
    severity: critical
