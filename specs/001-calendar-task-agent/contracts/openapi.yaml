openapi: 3.1.0
info:
  title: SpeciaelFamily Calendar API
  version: 1.0.0
  description: REST API for calendar task management and agent Q&A.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /tasks:
    get:
      summary: List tasks for a date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Tasks for selected date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
    post:
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate title for same day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tasks/{taskId}:
    patch:
      summary: Update an existing task
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stale update/delete conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete an existing task
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stale update/delete conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agent/session:
    post:
      summary: Start agent session
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '503':
          description: Agent unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agent/query:
    post:
      summary: Ask a calendar question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentQueryRequest'
      responses:
        '200':
          description: Answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentQueryResponse'
        '422':
          description: Clarification needed for ambiguous date context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Agent unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Task:
      type: object
      required: [id, title, task_date, creator_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        task_date:
          type: string
          format: date
        creator_name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskCreateRequest:
      type: object
      required: [title, task_date, creator_name]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        task_date:
          type: string
          format: date
        creator_name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 2000
    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        task_date:
          type: string
          format: date
        creator_name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 2000
    TaskListResponse:
      type: object
      required: [date, tasks]
      properties:
        date:
          type: string
          format: date
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    AgentSession:
      type: object
      required: [session_id, status, started_at]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, unavailable, closed]
        started_at:
          type: string
          format: date-time
    AgentQueryRequest:
      type: object
      required: [session_id, question_text]
      properties:
        session_id:
          type: string
          format: uuid
        question_text:
          type: string
          minLength: 1
        selected_date_context:
          type: string
          format: date
    AgentQueryResponse:
      type: object
      required: [query_id, status]
      properties:
        query_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [answered, clarification_required, error]
        response_text:
          type: string
        clarification_prompt:
          type: string
        error_message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
