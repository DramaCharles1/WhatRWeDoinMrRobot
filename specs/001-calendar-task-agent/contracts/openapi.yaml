openapi: 3.1.0
info:
  title: Home Calendar API
  version: 1.0.0
  description: REST API for creating, listing, editing, and deleting calendar events.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      summary: Backend health check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /events:
    get:
      summary: List events for a date (all-day first, then by start time, then creation order)
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Events for the selected date (empty list when none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: Missing or invalid date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{eventId}:
    parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update an existing event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete an existing event
      responses:
        '204':
          description: Deleted
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Event:
      type: object
      required: [id, title, event_date, is_all_day, start_time, end_time, notes, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        event_date:
          type: string
          format: date
        is_all_day:
          type: boolean
        start_time:
          type: [string, 'null']
          format: time
          description: Required when is_all_day is false; null when true.
        end_time:
          type: [string, 'null']
          format: time
          description: Required when is_all_day is false and must be later than start_time; null when true.
        notes:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventWriteRequest:
      type: object
      required: [title, event_date, is_all_day]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        event_date:
          type: string
          format: date
        is_all_day:
          type: boolean
        start_time:
          type: [string, 'null']
          format: time
        end_time:
          type: [string, 'null']
          format: time
        notes:
          type: string
          maxLength: 2000
    EventUpdateRequest:
      type: object
      description: Any subset of EventWriteRequest fields; the merged result must satisfy the same rules.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        event_date:
          type: string
          format: date
        is_all_day:
          type: boolean
        start_time:
          type: [string, 'null']
          format: time
        end_time:
          type: [string, 'null']
          format: time
        notes:
          type: string
          maxLength: 2000
    EventListResponse:
      type: object
      required: [date, events]
      properties:
        date:
          type: string
          format: date
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [validation_error, not_found]
        message:
          type: string
          examples: ['Title is required.']
        details:
          type: object
          additionalProperties: true
